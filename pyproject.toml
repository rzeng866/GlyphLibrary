[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "edalibrary"
version = "0.1.0"
description = "Exploratory data analysis for pandas DataFrames, rendered to a PDF report."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "rzeng866" }]
keywords = ["eda", "exploratory-data-analysis", "pandas", "report", "pdf", "profiling"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "pandas>=1.5",
    "numpy>=1.23",
    "matplotlib>=3.6",
    "reportlab>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/rzeng866/edalibrary"

[tool.hatch.build.targets.wheel]
packages = ["src/edalibrary"]

[tool.pytest.ini_options]
testpaths = ["tests"]
